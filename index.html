<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Target&RB</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #000;
      color: #e8f1ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-weight: 400;
    }

    .page {
      width: min(1180px, 100%);
      display: grid;
      gap: 24px;
    }

    .brand-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .brand {
      font-size: 0.92rem;
      font-weight: 400;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: #dbeafe;
    }

    .nav-link {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.92rem;
      transition: color 0.2s ease;
    }

    .nav-link:hover {
      color: #ffffff;
    }

    .layout {
      display: grid;
      grid-template-columns: 1.15fr 0.95fr;
      gap: 28px;
      align-items: stretch;
    }

    .panel {
      position: relative;
      border-radius: 28px;
      background: #02020a;
      border: 1px solid #2563eb;
      overflow: hidden;
    }

    .hero-panel {
      padding: 42px;
      display: grid;
      gap: 24px;
      min-height: 520px;
    }

    .hero-title {
      margin: 0;
      font-size: clamp(3rem, 4vw, 4.4rem);
      line-height: 1.02;
      letter-spacing: -0.04em;
      color: #eff6ff;
      font-weight: 400;
      max-width: 11ch;
    }

    .form-panel {
      padding: 34px;
      display: grid;
      gap: 22px;
    }

    .form-panel header {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-label {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 400;
      color: #eff6ff;
    }

    .form-description {
      margin: 0;
      color: #94a3b8;
      line-height: 1.8;
      font-weight: 400;
    }

    .form-grid {
      display: grid;
      gap: 16px;
    }

    label.field-label {
      display: block;
      margin-bottom: 10px;
      color: #94a3b8;
      font-size: 0.92rem;
      letter-spacing: 0.02em;
      font-weight: 400;
    }

    .field {
      width: 100%;
      border: 1px solid #2563eb;
      border-radius: 16px;
      padding: 16px 18px;
      background: #000;
      color: #e2e8f0;
      font-size: 1rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s ease;
      resize: vertical;
    }

    .field:hover,
    .field:focus {
      border-color: #3b82f6;
    }

    .submit-section {
      display: grid;
      gap: 12px;
    }

    .submit-button {
      width: fit-content;
      padding: 14px 26px;
      border: 1px solid #3b82f6;
      border-radius: 14px;
      background: transparent;
      color: #e2e8f0;
      font-size: 1rem;
      font-weight: 400;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.2s ease;
    }

    .submit-button:hover,
    .submit-button:focus-visible {
      background-color: rgba(59, 130, 246, 0.08);
      transform: translateY(-1px);
    }

    .status-message {
      min-height: 24px;
      color: #94f3a2;
      font-size: 0.95rem;
      font-weight: 400;
    }

    .status-small {
      color: #94a3b8;
      font-size: 0.9rem;
    }

    @media (max-width: 980px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .hero-panel,
      .form-panel {
        min-height: auto;
      }
    }

    @media (max-width: 640px) {
      body {
        padding: 18px;
      }

      .hero-panel {
        padding: 28px 22px 26px;
      }

      .form-panel {
        padding: 24px 20px;
      }

      .hero-title {
        font-size: clamp(2.4rem, 9vw, 3.6rem);
      }

      .brand,
      .nav-link {
        font-size: 0.88rem;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="brand-bar">
      <div class="brand">Target&RB</div>
      <a href="#request" class="nav-link">Open request</a>
    </header>

    <section class="layout">
      <section class="panel hero-panel">
        <h1 class="hero-title">Target&RB request control</h1>
      </section>

      <section class="panel form-panel" id="request">
        <header>
          <p class="form-label">Mission request</p>
          <p class="form-description">Enter the mission subject and the target information. Your request will be sent directly to the configured recipient.</p>
        </header>

        <form id="request-form" class="form-grid" action="https://formsubmit.co/cozyman.stuff@gmail.com" method="POST">
          <input type="hidden" name="_template" value="plain">
          <input type="hidden" name="_next" value="https://targetrb.github.io/">

          <div>
            <label for="user-input" class="field-label">Subject</label>
            <input id="user-input" name="_subject" class="field" type="text" placeholder="Enter request subject" required />
          </div>

          <div>
            <label for="reason-input-1" class="field-label">Target Info</label>
            <textarea id="reason-input-1" name="message" class="field" placeholder="Enter your request details" rows="10" aria-describedby="char-count" required></textarea>
            <p id="char-count" class="status-message" style="margin-top: 4px; color: #94a3b8;">0 characters</p>
            <p class="status-small">The text will be sent as a screenshot attachment.</p>
          </div>

          <div class="submit-section">
            <button type="submit" class="submit-button">Send request</button>
            <p id="status-message" class="status-message"></p>
          </div>
        </form>
      </section>
    </section>
  </main>

  <script>
    var reasonInput = document.getElementById('reason-input-1');
    var charCount = document.getElementById('char-count');
    var statusMessage = document.getElementById('status-message');
    var requestForm = document.getElementById('request-form');

    function updateCharCount() {
      var length = reasonInput.value.length;
      charCount.textContent = length + ' characters';
      charCount.style.color = '#94a3b8';
    }

    function wrapText(ctx, text, maxWidth) {
      var words = text.split(' ');
      var lines = [];
      var currentLine = words[0] || '';

      for (var i = 1; i < words.length; i++) {
        var word = words[i];
        var width = ctx.measureText(currentLine + ' ' + word).width;
        if (width < maxWidth) {
          currentLine += ' ' + word;
        } else {
          lines.push(currentLine);
          currentLine = word;
        }
      }

      lines.push(currentLine);
      return lines;
    }

    function renderTextAsImage(subject, text) {
      var canvas = document.createElement('canvas');
      var context = canvas.getContext('2d');
      var padding = 32;
      var lineHeight = 26;
      var maxWidth = 1080;
      var titleFont = '700 24px Inter, system-ui, sans-serif';
      var textFont = '18px Inter, system-ui, sans-serif';

      context.font = textFont;
      var paragraphs = text.split('\n');
      var lines = [];

      paragraphs.forEach(function (paragraph) {
        if (!paragraph) {
          lines.push('');
          return;
        }
        lines = lines.concat(wrapText(context, paragraph, maxWidth));
      });

      var titleLines = wrapText(context, subject || 'Target&RB request', maxWidth);
      var imageHeight = padding * 2 + titleLines.length * lineHeight + 16 + lines.length * lineHeight;
      canvas.width = maxWidth + padding * 2;
      canvas.height = imageHeight;

      context.fillStyle = '#000';
      context.fillRect(0, 0, canvas.width, canvas.height);
      context.fillStyle = '#e8f1ff';
      context.fillRect(padding - 8, padding - 8, canvas.width - padding * 2 + 16, canvas.height - padding * 2 + 16);
      context.fillStyle = '#02020a';
      context.fillRect(padding - 4, padding - 4, canvas.width - padding * 2 + 8, canvas.height - padding * 2 + 8);

      context.fillStyle = '#ffffff';
      context.font = titleFont;
      context.textBaseline = 'top';
      var y = padding;
      titleLines.forEach(function (line) {
        context.fillText(line, padding, y);
        y += lineHeight;
      });

      y += 12;
      context.font = textFont;
      lines.forEach(function (line) {
        context.fillText(line, padding, y);
        y += lineHeight;
      });

      return new Promise(function (resolve) {
        canvas.toBlob(function (blob) {
          resolve(blob);
        }, 'image/png');
      });
    }

    async function sendScreenshotForm(event) {
      event.preventDefault();

      var subject = document.getElementById('user-input').value.trim() || 'Target&RB request';
      var targetInfo = reasonInput.value.trim();
      if (!targetInfo) {
        statusMessage.textContent = 'Please enter Target Info before sending.';
        return;
      }

      statusMessage.textContent = 'Preparing screenshot...';
      statusMessage.style.color = '#94a3b8';

      try {
        var imageBlob = await renderTextAsImage(subject, targetInfo);
        if (!imageBlob) {
          throw new Error('Unable to create screenshot image.');
        }

        var formData = new FormData();
        formData.append('_subject', subject);
        formData.append('message', 'Target info screenshot attached.');
        formData.append('_template', 'plain');
        formData.append('_next', window.location.href);
        formData.append('attachment', imageBlob, 'target-info.png');

        var response = await fetch(requestForm.action, {
          method: 'POST',
          body: formData,
        });

        var responseText = await response.text();
        if (!response.ok || responseText.includes('Unable to submit form')) {
          throw new Error('Form delivery failed. Make sure the page is opened from a web server.');
        }

        statusMessage.textContent = 'Sent! The target info screenshot has been uploaded.';
        statusMessage.style.color = '#94f3a2';
        requestForm.reset();
        updateCharCount();
      } catch (error) {
        statusMessage.textContent = 'Send failed: ' + error.message;
        statusMessage.style.color = '#fda4af';
      }
    }

    reasonInput.addEventListener('input', updateCharCount);
    requestForm.addEventListener('submit', sendScreenshotForm);
    updateCharCount();
  </script>
</body>
</html>
